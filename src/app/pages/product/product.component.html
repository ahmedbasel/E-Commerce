<div class="container py-4 py-md-5">

   <div class="text-center mb-4 mb-md-5">
    <h2 class="fw-bold mb-2 fs-3 fs-md-2">{{'header.AllProducts'|translate}}</h2>
    <div class="mx-auto" style="width: 60px; height: 3px; background: #28a745; border-radius: 2px;"></div>
  </div>

  <div class="d-flex justify-content-center mb-4 mb-md-5 mt-2 px-2">
    <div class="input-group shadow-sm border rounded-pill overflow-hidden" style="max-width: 500px; width: 100%;">
      <span class="input-group-text bg-white border-0 ps-3 ps-md-4">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input 
        type="text" 
        class="form-control border-0 py-2 fs-6 shadow-none" 
        placeholder="{{'search.search-PRO'| translate}}" 
        [(ngModel)]="searchval"
      >
    </div>
  </div>
<div class="row g-3 mb-4 mb-md-5 justify-content-center align-items-center">
  
  <div class="col-12 col-md-4">
    <div class="input-group shadow-sm border rounded-pill overflow-hidden bg-white">
      <span class="input-group-text bg-white border-0 ps-3">
        <i class="bi bi-grid text-muted"></i>
      </span>
      <select [formControl]="categoryControl" class="form-select border-0 shadow-none py-2 text-secondary fs-6 cursor-pointer">
        <option value="">All Categories</option>
        @for (cat of allCategoryID; track $index) {
          <option [value]="cat._id">
            {{cat.name}}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="col-6 col-md-4">
    <div class="input-group shadow-sm border rounded-pill overflow-hidden bg-white">
      <span class="input-group-text bg-white border-0 ps-3">
        <i class="bi bi-arrow-up-circle text-muted"></i>
      </span>
      <input 
        (keyup)="getproduct()"
        [(ngModel)]="pricegt"
        type="number" 
        class="form-control border-0 py-2 fs-6 shadow-none" 
        placeholder="Min Price ( More Than )" 
      >
    </div>
  </div>

  <div class="col-6 col-md-4">
    <div class="input-group shadow-sm border rounded-pill overflow-hidden bg-white">
      <span class="input-group-text bg-white border-0 ps-3">
        <i class="bi bi-arrow-down-circle text-muted"></i>
      </span>
      <input 
        (keyup)="getproduct()"
        [(ngModel)]="pricelt"
        type="number" 
        class="form-control border-0 py-2 fs-6 shadow-none" 
        placeholder="Max Price ( Less Than )" 
      >
    </div>
  </div>

</div>
  <div class="row g-2 g-md-3 g-lg-4">
    @for (p of allproduct | search:searchval; track p._id) {
    <div class="col-6 col-md-4 col-lg-3">
      <div class="card h-100 border-0 shadow-sm rounded-3 rounded-md-4 position-relative overflow-hidden">
        
        <div class="wishlist-icon cursor-pointer position-absolute top-0 end-0 z-3 m-2 m-md-3" (click)="addtowishlist(p._id)">
          <i class="fa-regular fa-heart"></i>
        </div>

        <div class="overflow-hidden">
          <img 
            [src]="p.imageCover" 
            [routerLink]="['/single', p._id]" 
            class="card-img-top img-fluid cursor-pointer transition-transform" 
            style="width: 100%; aspect-ratio: 1/1; object-fit: cover;"
            alt="{{p.title}}"
          >
        </div>

        <div class="card-body d-flex flex-column p-2 p-md-3">
          <div class="mb-1 mb-md-2">
            <span class="badge bg-light text-muted fw-normal text-truncate max-w-100">{{ p.category.name }}</span>
          </div>
          <h6 class="card-title fw-bold text-dark text-truncate mb-1 mb-md-2 fs-6" [title]="p.title">{{ p.title }}</h6>
          
          <div class="mb-2 text-warning small d-flex align-items-center flex-wrap">
            <div class="d-flex me-1">
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
            </div>
            <span class="text-muted small ms-1">(4.5)</span>
          </div>

          <div class="mt-auto">
            <p class="fw-bold text-success fs-6 fs-md-5 mb-2 mb-md-3">{{ p.price | currency:'EGP ' }}</p>
            <button (click)="addtocart(p._id)" class="btn btn-success w-100 rounded-pill fw-bold py-2 py-md-2 btn-sm fs-md-6 shadow-sm d-flex align-items-center justify-content-center">
              <i class="bi bi-bag-plus me-1"></i>
              <span class="d-none d-sm-inline">Add to Cart</span>
              <span class="d-inline d-sm-none">Add</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    }

    @if (isLoading) {
      <div class="col-12 py-5 text-center">
        <app-loader></app-loader>
      </div>
    }
  </div>

  <div class="d-flex justify-content-center align-items-center mt-4 mt-md-5">
    <nav aria-label="Product pagination" class="w-100 max-w-md">
      <ul class="pagination align-items-center justify-content-center mb-0 px-2">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link shadow-sm rounded-start-pill px-2 px-md-3 py-1 py-md-2" (click)="pervpage()">
            <i class="bi bi-chevron-left me-1"></i>
            <span class="d-none d-sm-inline">{{'Product.perv'|translate}}</span>
          </button>
        </li>

        <li class="mx-2 mx-md-3 fw-bold text-muted small text-uppercase text-center">
          Page {{ currentPage }} <span class="mx-1 text-secondary opacity-50">of</span> {{ totalPages }}
        </li>

        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link shadow-sm rounded-end-pill px-2 px-md-3 py-1 py-md-2" (click)="nextpage()">
            <span class="d-none d-sm-inline">{{'Product.next'|translate}}</span>
            <i class="bi bi-chevron-right ms-1"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
