<div class="container mt-5 pt-5 d-flex justify-content-center">
  <div class="col-lg-6 col-md-8 col-12">

    <div class="card ecommerce-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="fw-bold mb-0">
            <i class="bi bi-geo-alt text-primary me-2"></i>
            {{ 'address.Saved-Addresses' | translate }}
          </h4>

          <button (click)="addadd()" class="btn btn-primary btn-sm rounded-pill px-3">
            <i class="bi bi-plus-lg me-1"></i>
            {{ 'address.Add-New' | translate }}
          </button>
        </div>

        <div class="address-list">
          @for (address of addressdata; track address._id) {
            <div class="address-item mb-3 shadow-none">

              <div class="address-info">
                <div class="d-flex align-items-center mb-1">
                  <span class="fw-bold text-dark me-2">{{ address.name }}</span>
                  <span class="badge bg-light text-muted border small fw-normal">
                    {{ 'address.Home' | translate }}
                  </span>
                </div>

                <p class="text-muted small mb-1">
                  <i class="bi bi-map me-1"></i> {{ address.details }}
                </p>

                <p class="small text-dark mb-0">
                  <i class="bi bi-telephone-outbound me-1 small"></i> {{ address.phone }}
                </p>
              </div>

              <div class="address-actions">
                <button
                  (click)="deleteaddress(address._id)"
                  class="btn btn-outline-danger btn-sm btn-delete border-0"
                  [title]="'address.Delete-Address' | translate"
                >
                  <i class="bi bi-trash3 fs-6">{{'address.Delete-Address' | translate}}</i>
                </button>
              </div>

            </div>
          } @empty {
            <div class="text-center py-4">
              <i class="bi bi-mailbox text-muted mb-3" style="font-size: 3rem;"></i>
              <p class="text-muted small">
                {{ 'address.No-Addresses' | translate }}
              </p>
            </div>
          }
        </div>

        <div class="mt-4 pt-3 border-top text-center">
          <a routerLink="/profile" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>
            {{ 'address.Return-To-Profile' | translate }}
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
