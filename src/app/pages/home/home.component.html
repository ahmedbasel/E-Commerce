<section class="hero-section">

  <div class="hero-content">
    <span class="hero-badge">NEW COLLECTION</span>

    <h1>
      Find What You
      <span>Love.</span>
    </h1>

    <p>
      Discover our latest products and enjoy exclusive deals.
    </p>

    <a
      routerLink="/product"
      class="btn btn-dark rounded-pill px-4 py-3 fw-bold">
      Shop Now
    </a>
  </div>

  <div class="hero-image">
    <img
      src="Online store Vectors - Download Free High-Quality Vectors _ Magnific (formerly Freepik).jpg"
      alt="Shopping">
  </div>

</section>

<div class="container py-4 py-md-5">


  <div class="text-center mb-4 mb-md-5">
    <h2 class="fw-bold mb-2 fs-3 fs-md-2">{{'header.PopularProducts'|translate}}</h2>
    <div class="mx-auto" style="width: 60px; height: 3px; background: #28a745; border-radius: 2px;"></div>
  </div>

 
  <div class="d-flex justify-content-center mb-4 mb-md-5 px-2">
    <div class="input-group shadow-sm" style="max-width: 500px; width: 100%;">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input
        type="text"
        class="form-control border-start-0 py-2 fs-6"
        placeholder="{{'search.search-home'| translate}}"
        [(ngModel)]="searchval"
      />
    </div>
  </div>

 
  <div class="row g-2 g-md-3 g-lg-4">
    @for (p of allproduct | search:searchval; track p._id) {
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card product-card h-100 border-0 shadow-sm rounded-3 rounded-md-4 overflow-hidden">
          
         
          <div class="overflow-hidden position-relative">
            <img
              [src]="p.imageCover"
              [routerLink]="['/single', p._id]"
              class="card-img-top img-hover cursor-pointer"
              style="object-fit: cover; aspect-ratio: 1/1;"
              alt="{{p.title}}"
            />
            <button (click)="addtowishlist(p._id)" class="btn btn-light btn-sm position-absolute top-0 end-0 m-2 m-md-3 rounded-circle shadow-sm p-1 p-md-2 d-flex align-items-center justify-content-center">
              <i class="bi bi-heart text-danger fs-6"></i>
            </button>
          </div>

         
          <div class="card-body d-flex flex-column p-2 p-md-3 p-lg-4">
            <span class="category-badge mb-1 mb-md-2 text-muted small text-truncate">{{ p.category.name }}</span>
            
            <h6 class="card-title fw-bold text-dark text-truncate mb-1 mb-md-2 fs-6" [title]="p.title">
              {{ p.title }}
            </h6>

            <div class="mb-2 text-warning small d-flex align-items-center flex-wrap">
              <div class="d-flex me-1">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
              </div>
              <span class="text-muted small">(4.5)</span>
            </div>

           
            <div class="mt-auto">
              <div class="d-flex justify-content-between align-items-center mb-2 mb-md-3">
                <span class="fs-6 fs-md-5 fw-bold text-success">{{ p.price | currency:'EGP ' }}</span>
              </div>

              <button
                (click)="addtocart(p._id)"
                class="btn btn-gradient w-100 py-2 rounded-3 fw-bold btn-sm fs-md-6 d-flex align-items-center justify-content-center"
              >
                <i class="bi bi-bag-plus me-1 me-md-2 fs-6"></i>
                <span class="d-none d-sm-inline">Add to Cart</span>
                <span class="d-inline d-sm-none">Add</span>
              </button>
            </div>
          </div>

        </div>
      </div>
    }

    
    @if (isloading) {
      <div class="col-12 py-5">
        <app-loader></app-loader>
      </div>
    }
  </div>

  <app-shopbycategory></app-shopbycategory>
</div>
