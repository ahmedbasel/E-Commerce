<div class="container mt-5 pt-5 d-flex justify-content-center">
  <div class="col-lg-5 col-md-8">

    <div class="card ecommerce-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="bg-primary bg-opacity-10 d-inline-block p-3 rounded-circle mb-3 text-primary">
            <i class="bi bi-geo-alt fs-2"></i>
          </div>

          <h4 class="fw-bold mb-1">
            {{ 'addresss.Shipping-Address' | translate }}
          </h4>

          <p class="text-muted small">
            {{ 'addresss.Shipping-Info' | translate }}
          </p>
        </div>

        <form [formGroup]="address">

          <div class="mb-3">
            <label class="form-label small fw-bold text-dark">
              {{ 'addresss.Recipient-Name' | translate }}
            </label>

            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-person"></i>
              </span>

              <input
                formControlName="name"
                type="text"
                class="form-control ecommerce-input border-start-0 ps-0"
                [placeholder]="'addresss.Recipient-Placeholder' | translate"
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-dark">
              {{ 'addresss.Address-Details' | translate }}
            </label>

            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-house-door"></i>
              </span>

              <input
                formControlName="details"
                type="text"
                class="form-control ecommerce-input border-start-0 ps-0"
                [placeholder]="'addresss.Address-Placeholder' | translate"
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold text-dark">
              {{ 'addresss.Contact-Phone' | translate }}
            </label>

            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-telephone"></i>
              </span>

              <input
                formControlName="phone"
                type="text"
                class="form-control ecommerce-input border-start-0 ps-0"
                [placeholder]="'addresss.Phone-Placeholder' | translate"
              >
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label small fw-bold text-dark">
              {{ 'addresss.City-Area' | translate }}
            </label>

            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted">
                <i class="bi bi-building"></i>
              </span>

              <input
                formControlName="city"
                type="text"
                class="form-control ecommerce-input border-start-0 ps-0"
                [placeholder]="'addresss.City-Placeholder' | translate"
              >
            </div>
          </div>

          <div class="status-messages mb-3">

            @if (iserror === true) {
              <div class="alert alert-danger d-flex align-items-center justify-content-center shadow-sm">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ 'addresss.Error' | translate }}
              </div>
            }

            @if (iserror === false) {
              <div class="alert alert-success d-flex align-items-center justify-content-center shadow-sm">
                <i class="bi bi-check-circle-fill me-2"></i>
                {{ 'addresss.Success' | translate }}
              </div>
            }

          </div>

          @if (isloading) {
            <button class="btn ecommerce-btn w-100 py-3 shadow-sm" disabled>
              <span class="spinner-border spinner-border-sm me-2"></span>
              {{ 'addresss.Saving' | translate }}
            </button>
          } @else {
            <button
              (click)="adduseraddress(address)"
              [disabled]="address.invalid"
              class="btn ecommerce-btn w-100 py-3 shadow-sm fw-bold"
            >
              <i class="bi bi-plus-circle me-2"></i>
              {{ 'addresss.Save-Btn' | translate }}
            </button>
          }

        </form>

      </div>
    </div>

    <div class="text-center mt-4">
      <a routerLink="/profile" class="text-decoration-none text-muted small">
        <i class="bi bi-arrow-left me-1"></i>
        {{ 'addresss.Back' | translate }}
      </a>
    </div>

  </div>
</div>
