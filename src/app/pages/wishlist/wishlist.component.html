<div class="container py-4 py-md-5">
  
  
  @if (isadd) {
    <div class="alert custom-alert text-center position-fixed top-0 start-50 translate-middle-x shadow-lg px-3 px-md-5 py-2 py-md-3 mt-3 rounded-pill fs-6" role="alert" style="z-index: 2000; max-width: 90vw;">
      <i class="bi bi-check2-circle me-2"></i> Product added to cart successfully
    </div>
  }


  <div class="text-center mb-4 mb-md-5">
    <h2 class="fw-bold fs-3 fs-md-2">
      <i class="fa-solid fa-heart text-danger animate__animated animate__heartBeat animate__infinite me-1"></i>
      My Wishlist
    </h2>
    <p class="text-muted small fs-md-6 mb-0">Items you've saved for later</p>
  </div>


  <div class="row g-2 g-md-3 g-lg-4">
    @for (p of allproduct; track p._id) {
      <div class="col-6 col-md-4 col-lg-3">
        <div class="card wishlist-card h-100 border-0 shadow-sm rounded-3 rounded-md-4 overflow-hidden">
          
          <div class="position-relative">
            <img [src]="p.imageCover" class="wishlist-img w-100" style="aspect-ratio: 1/1; object-fit: cover;" alt="product" />
          </div>

          <div class="card-body d-flex flex-column p-2 p-md-3">
            <div class="mb-1 text-muted small uppercase fw-semibold text-truncate">{{p.category.name}}</div>
            <h6 class="card-title fw-bold text-truncate mb-2 fs-6" [title]="p.title">{{p.title}}</h6>
            
            <div class="mt-auto">
              <p class="fw-bold text-success fs-6 fs-md-5 mb-2 mb-md-3">{{p.price}EGP}</p>
              
              <div class="d-flex gap-1 gap-md-2">
                <button (click)="addtocart(p._id)" class="btn btn-primary w-100 rounded-pill fw-bold btn-sm py-1 py-md-2 d-flex align-items-center justify-content-center">
                  <i class="fa-solid fa-cart-plus me-1"></i>
                  <span class="d-none d-sm-inline">Add</span>
                </button>
                
                <button (click)="deleteproduct(p._id)" class="btn btn-delete rounded-pill px-2 px-md-3 btn-sm d-flex align-items-center justify-content-center" title="Remove from wishlist">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    }

    <!-- Empty State -->
    @if (allproduct.length === 0) {
      <div class="col-12 text-center py-5">
        <i class="bi bi-heartbreak text-muted mb-3 d-block" style="font-size: 3.5rem;"></i>
        <h4 class="text-muted fs-5 fs-md-4">Your wishlist is empty</h4>
        <button routerLink="/home" class="btn btn-outline-primary mt-3 rounded-pill px-4">Explore Products</button>
      </div>
    }
  </div>
</div>
