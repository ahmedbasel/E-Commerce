<div class="reset-container container">
  <div class="reset-card border-0 shadow-sm">

    <div class="text-center mb-4">
      <div class="bg-primary bg-opacity-10 d-inline-block p-3 rounded-circle mb-3 text-primary">
        <i class="bi bi-key fs-2"></i>
      </div>
      <h2 class="fw-bold text-dark">Reset Password</h2>
      <p class="text-muted small">Enter your email and create a strong new password.</p>
    </div>

    <form [formGroup]="restpassword" (ngSubmit)="getdata(restpassword)">
      
      <!-- <div class="mb-3">
        <label class="form-label small fw-bold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted small">
            <i class="bi bi-envelope"></i>
          </span>
          <input 
            formControlName="email"
            type="email" 
            class="form-control ecommerce-input border-start-0 ps-0" 
            placeholder="name@example.com"
          >
        </div>
      </div> -->

      <div class="mb-4">
        <label class="form-label small fw-bold">New Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted small">
            <i class="bi bi-lock-safe"></i>
          </span>
          <input
            formControlName="newPassword"
            type="password" 
            class="form-control ecommerce-input border-start-0 ps-0" 
            placeholder="Enter new password"
          >
        </div>
        <div class="form-text mt-2" style="font-size: 0.75rem;">
          Make sure it's at least 6 characters long.
        </div>
      </div>

      <div class="d-grid gap-2">
        <button 
          type="submit" 
          [disabled]="restpassword.invalid" 
          class="btn btn-reset shadow-sm fw-bold"
        >
          Update Password
        </button>
        
        <a routerLink="/login" class="btn btn-link text-muted text-decoration-none small mt-2">
          I remembered my password
        </a>
      </div>

    </form>
  </div>
</div>
