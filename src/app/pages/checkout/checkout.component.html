<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">

      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <div class="bg-primary py-2"></div>

        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <h3 class="fw-bold">{{ 'checkout.Title' | translate }}</h3>
            <p class="text-muted small">{{ 'checkout.Subtitle' | translate }}</p>
          </div>

          <form [formGroup]="addressform">

            <div class="mb-3">
              <label class="form-label fw-semibold small text-uppercase">
                {{ 'checkout.Address' | translate }}
              </label>

              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-geo-alt text-muted"></i>
                </span>

                <input
                  formControlName="details"
                  type="text"
                  class="form-control border-start-0 luxury-input"
                    [placeholder]="'checkout.Address-Placeholder' | translate"
                >
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold small text-uppercase">
                {{ 'checkout.Phone' | translate }}
              </label>

              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-telephone text-muted"></i>
                </span>

                <input
                  formControlName="phone"
                  type="tel"
                  class="form-control border-start-0 luxury-input"
                   [placeholder]="'checkout.Phone-Placeholder' | translate"
/>
                
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold small text-uppercase">
                {{ 'checkout.City' | translate }}
              </label>

              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="bi bi-building text-muted"></i>
                </span>

                <input
                  formControlName="city"
                  type="text"
                  class="form-control border-start-0 luxury-input"
                  [placeholder]="'checkout.City-Placeholder' | translate"
                >
              </div>
            </div>

            <div class="mt-4">

              @if (isloading) {
                <button class="btn btn-primary w-100 py-3 rounded-3" disabled>
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  {{ 'checkout.Processing' | translate }}
                </button>
              } @else {

                <button
                  (click)="checkout(addressform)"
                  [disabled]="addressform.invalid"
                  class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-3 shadow-sm"
                >
                  <i class="bi bi-credit-card me-2"></i>
                  {{ 'checkout.Pay-Online' | translate }}
                </button>

                <div class="divider small text-uppercase fw-bold">
                  {{ 'checkout.OR' | translate }}
                </div>

                <button
                  (click)="COD(addressform)"
                  [disabled]="addressform.invalid"
                  class="btn btn-outline-dark w-100 py-3 rounded-3 fw-bold"
                >
                  <i class="bi bi-cash-stack me-2"></i>
                  {{ 'checkout.COD' | translate }}
                </button>

              }

            </div>

            <p class="text-center text-muted small mt-4">
              <i class="bi bi-shield-check me-1"></i>
              {{ 'checkout.Secure' | translate }}
            </p>

          </form>

        </div>
      </div>

      <div class="text-center mt-4">
        <a routerLink="/cart" class="text-decoration-none text-muted small">
          <i class="bi bi-arrow-left me-1"></i>
          {{ 'checkout.Back' | translate }}
        </a>
      </div>

    </div>
  </div>
</div>
