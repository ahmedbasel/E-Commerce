<div class="verify-container container">
  <div class="verify-card border-0 shadow-sm text-center">

    <div class="mb-4">
      <div class="bg-info bg-opacity-10 d-inline-block p-3 rounded-circle mb-3 text-info">
        <i class="bi bi-chat-left-dots fs-2"></i>
      </div>
      <h2 class="fw-bold text-dark">{{'verifyAccount.title'|translate}}</h2>
      <p class="text-muted small px-3">
       {{'verifyAccount.description'|translate}}
      </p>
    </div>

    <form [formGroup]="restcode" (ngSubmit)="getdata(restcode)">
      
      <div class="mb-4">
        <label class="form-label small fw-bold d-block text-start ms-1"></label>
        <input
          formControlName="resetCode"
          type="text" 
          class="form-control code-input" 
          placeholder="000000"
          maxlength="6"
        >
        
        @if(restcode.get('resetCode')?.touched && restcode.get('resetCode')?.hasError('required')){
          <div class="text-danger small mt-2 text-start">
            <i class="bi bi-exclamation-circle me-1"></i>        {{'verifyAccount.codereq'|translate}}

          </div>
        }
      </div>

      <div class="d-grid gap-3">
        <button 
          type="submit" 
          [disabled]="restcode.invalid" 
          class="btn btn-verify shadow-sm"
        >
          {{'verifyAccount.verifyCode'|translate}}
        </button>

       
      </div>
 @if (iserror) {
        <div class="alert alert-danger mt-3 py-2 small text-center border-0 shadow-sm">
          <i class="bi bi-exclamation-triangle me-1"></i>  {{'verifyAccount.invalidCode'|translate}}
        </div>
      }
    </form>
  </div>
</div>
